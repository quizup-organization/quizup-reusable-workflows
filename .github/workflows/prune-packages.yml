name: Prune Packages & Caches

# Réduit l'empreinte de stockage GitHub (allowance partagée artefacts + GitHub Packages) :
#  - purge les anciennes versions d'images GHCR (en conservant les N plus récentes + les tags déployés) ;
#  - purge les caches Actions non accédés depuis > 7 jours (non facturés, mais limités à 10 GB/repo).
#
# Le repo est public : les minutes Actions de ce workflow sont gratuites.
# Requiert un secret repo `QUIZUP_GITHUB_TOKEN` (PAT classic `repo` + `delete:packages`).

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      keep:
        description: "Versions d'image à conserver par package"
        required: false
        default: "1"
      dry-run:
        description: "Simuler sans supprimer"
        required: false
        type: boolean
        default: true

concurrency:
  group: prune-packages
  cancel-in-progress: false

jobs:
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Collecter les tags déployés (quizup-gitops)
        id: deployed
        env:
          GH_TOKEN: ${{ secrets.QUIZUP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAGS=""
          paths=$(gh api "/repos/quizup-organization/quizup-gitops/git/trees/main?recursive=1" \
            --jq '.tree[].path | select(test("\\.argocd-source-.*\\.ya?ml$"))' 2>/dev/null || true)
          for p in $paths; do
            content=$(gh api "/repos/quizup-organization/quizup-gitops/contents/$p" \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true)
            tag=$(printf '%s' "$content" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
            [ -n "$tag" ] && TAGS="$TAGS,$tag"
          done
          TAGS="${TAGS#,}"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Tags déployés protégés : ${TAGS:-<aucun>}"

      - name: Purger les images GHCR
        uses: ./actions/prune-packages
        with:
          token: ${{ secrets.QUIZUP_GITHUB_TOKEN }}
          owner: quizup-organization
          package-type: container
          keep: ${{ inputs.keep || '1' }}
          protect-tags: ${{ steps.deployed.outputs.tags }}
          dry-run: ${{ inputs.dry-run == 'true' }}

  caches:
    runs-on: ubuntu-latest
    steps:
      - name: Purger les caches Actions (> 7 jours)
        env:
          GH_TOKEN: ${{ secrets.QUIZUP_GITHUB_TOKEN }}
          ORG: quizup-organization
          DRY_RUN: ${{ inputs.dry-run == 'true' }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Cutoff (last_accessed_at < $cutoff)"
          repos=$(gh repo list "$ORG" --limit 200 --json name,isPrivate --jq '.[] | select(.isPrivate) | .name')
          for repo in $repos; do
            echo "::group::$repo"
            gh api --paginate "/repos/$ORG/$repo/actions/caches?per_page=100" \
              --jq '.actions_caches[] | "\(.id)\t\(.last_accessed_at)"' | \
              while IFS=$'\t' read -r id accessed; do
                [ -z "$id" ] && continue
                if [[ "$accessed" < "$cutoff" ]]; then
                  if [ "$DRY_RUN" = "true" ]; then
                    echo "[dry-run] delete cache $id (last_accessed=$accessed)"
                  else
                    gh api -X DELETE "/repos/$ORG/$repo/actions/caches/$id" >/dev/null \
                      && echo "deleted cache $id ($accessed)"
                  fi
                fi
              done
            echo "::endgroup::"
          done
