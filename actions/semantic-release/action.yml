name: Semantic Release
description: Install and run semantic-release with the shared organization config.
inputs:
  node-version:
    description: Node.js version
    required: false
    default: "22"
  github-token:
    description: GitHub token used by semantic-release
    required: true
  release-profile:
    description: Shared semantic-release profile to use (maven or npm)
    required: false
    default: "maven"
  config-file:
    description: Optional path to semantic-release config file
    required: false
    default: ""

outputs:
  released:
    description: "true si une nouvelle version a été publiée (nouveau tag créé)"
    value: ${{ steps.semrel.outputs.released }}
  version:
    description: "Version publiée (sans préfixe v), vide si aucune release"
    value: ${{ steps.semrel.outputs.version }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install semantic-release
      shell: bash
      run: |
        mkdir -p /tmp/semantic-release
        cd /tmp/semantic-release
        npm install \
          semantic-release@^25 \
          @semantic-release/commit-analyzer@^13 \
          @semantic-release/release-notes-generator@^14 \
          @semantic-release/changelog@^7 \
          @semantic-release/exec@^7 \
          @semantic-release/git@^11 \
          @semantic-release/npm@^13 \
          @semantic-release/github@^12 \
          conventional-changelog-conventionalcommits@^8

    - name: Run semantic-release
      id: semrel
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        NODE_PATH: /tmp/semantic-release/node_modules
      run: |
        CONFIG_FILE="${{ inputs.config-file }}"
        if [ -z "$CONFIG_FILE" ]; then
          PROFILE="${{ inputs.release-profile }}"
          case "$PROFILE" in
            maven)
              CONFIG_FILE="${GITHUB_ACTION_PATH}/../../semantic-release/release.maven.config.cjs"
              ;;
            npm)
              CONFIG_FILE="${GITHUB_ACTION_PATH}/../../semantic-release/release.npm.config.cjs"
              ;;
            *)
              echo "Unsupported release profile: $PROFILE" >&2
              exit 1
              ;;
          esac
        fi
        CONFIG_FILE="$(realpath "$CONFIG_FILE")"

        PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

        /tmp/semantic-release/node_modules/.bin/semantic-release \
          --extends "$CONFIG_FILE"

        NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -n "$NEW_TAG" ] && [ "$PREV_TAG" != "$NEW_TAG" ]; then
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Nouvelle release publiée : ${NEW_TAG#v}"
        else
          echo "released=false" >> "$GITHUB_OUTPUT"
          echo "version=" >> "$GITHUB_OUTPUT"
          echo "Aucune release publiée (aucun changement pertinent)."
        fi