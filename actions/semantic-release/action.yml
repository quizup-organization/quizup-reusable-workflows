name: Semantic Release
description: Install and run semantic-release with the shared organization config.
inputs:
  node-version:
    description: Node.js version
    required: false
    default: "22"
  github-token:
    description: GitHub token used by semantic-release
    required: true
  release-profile:
    description: Shared semantic-release profile to use (maven or npm)
    required: false
    default: "maven"
  config-file:
    description: Optional path to semantic-release config file
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install semantic-release
      shell: bash
      run: |
        mkdir -p /tmp/semantic-release
        cd /tmp/semantic-release
        npm install \
          semantic-release \
          @semantic-release/commit-analyzer \
          @semantic-release/release-notes-generator \
          @semantic-release/changelog \
          @semantic-release/exec \
          @semantic-release/git \
          @semantic-release/npm \
          @semantic-release/github \
          conventional-changelog-conventionalcommits

    - name: Run semantic-release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        NODE_PATH: /tmp/semantic-release/node_modules
      run: |
        CONFIG_FILE="${{ inputs.config-file }}"
        if [ -z "$CONFIG_FILE" ]; then
          PROFILE="${{ inputs.release-profile }}"
          case "$PROFILE" in
            maven)
              CONFIG_FILE="${GITHUB_ACTION_PATH}/../../semantic-release/release.maven.config.cjs"
              ;;
            npm)
              CONFIG_FILE="${GITHUB_ACTION_PATH}/../../semantic-release/release.npm.config.cjs"
              ;;
            *)
              echo "Unsupported release profile: $PROFILE" >&2
              exit 1
              ;;
          esac
        fi
        CONFIG_FILE="$(realpath "$CONFIG_FILE")"

        /tmp/semantic-release/node_modules/.bin/semantic-release \
          --extends "$CONFIG_FILE"